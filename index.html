<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#142333" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PachinkoTracker" />
    <title>PachinkoTracker</title>
    <!-- GitHub Pages project siteでは /REPO_NAME/ に変更してください（README参照） -->
    <base href="/pachinko-tracker.github.io/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>
    <div id="app"><div class="boot">PachinkoTrackerを起動しています...</div></div>
    <div id="blazor-error-ui">エラーが発生しました。<a href="." class="reload">再読み込み</a></div>
    <script src="js/pachinkoDb.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).catch(console.error);
            });
        }
    </script>
</body>
</html>
